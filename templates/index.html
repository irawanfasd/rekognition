<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detektor Bahasa Isyarat</title>
<style>
  :root {
    --navy: #0f1b3d;
    --gold: #c9a227;
    --bg: #f6f5f2;
  }
  body {
    margin: 0;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--navy);
  }
  header {
    background: var(--navy);
    color: white;
    padding: 1.2rem 1.5rem;
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  .container {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    padding: 1.5rem;
  }
  .video-card {
    flex: 1 1 400px;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .video-card img { width: 100%; display: block; }
  .translation {
    padding: 1rem 1.2rem;
    border-top: 3px solid var(--gold);
  }
  .translation .label { font-size: 0.8rem; opacity: 0.6; }
  .translation .text { font-size: 1.6rem; font-weight: 600; min-height: 2rem; }
  .history-card {
    flex: 1 1 300px;
    background: white;
    border-radius: 12px;
    padding: 1.2rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    max-height: 520px;
    overflow-y: auto;
  }
  .history-card h2 { margin-top: 0; font-size: 1.1rem; }
  .history-item {
    display: flex;
    justify-content: space-between;
    padding: 0.5rem 0;
    border-bottom: 1px solid #eee;
    font-size: 0.95rem;
  }
  .history-item .time { opacity: 0.5; font-size: 0.8rem; }
</style>
</head>
<body>
  <header>
    <h1>Detektor Bahasa Isyarat</h1>
  </header>

  <div class="container">
    <div class="video-card">
      <img src="/video_feed" alt="Live camera feed">
      <div class="translation">
        <div class="label">Terjemahan saat ini</div>
        <div class="text" id="current-text">-</div>
      </div>
    </div>

    <div class="history-card">
      <h2>Riwayat Komunikasi</h2>
      <div id="history-list"></div>
    </div>
  </div>

<script>
async function pollCurrent() {
  try {
    const res = await fetch('/api/current');
    const data = await res.json();
    document.getElementById('current-text').textContent = data.text || '-';
  } catch (e) { /* server mungkin belum siap, abaikan */ }
}

async function pollHistory() {
  try {
    const res = await fetch('/api/history');
    const items = await res.json();
    const container = document.getElementById('history-list');
    container.innerHTML = items.map(item => `
      <div class="history-item">
        <span>${item.detected_text}</span>
        <span class="time">${item.timestamp.split('T')[1] || ''}</span>
      </div>
    `).join('');
  } catch (e) { /* abaikan */ }
}

setInterval(pollCurrent, 800);
setInterval(pollHistory, 3000);
pollCurrent();
pollHistory();
</script>
</body>
</html>
